services:
    mysql:
      image: mysql:8
      container_name: mysql_db
      restart: always
      environment:
         MYSQL_ROOT_PASSWORD: rootpassword
         MYSQL_DATABASE: appdb
         MYSQL_USER: appuser
         MYSQL_PASSWORD: apppassword
      volumes:
        - mysql_data:/var/lib/mysql
    
    redis:
      image: redis:latest
      container_name: redis_cache
      restart: always
    
    api:
      build: .
      depends_on:
        - mysql
        - redis
      restart: always
      environment:
        DB_HOST: mysql
        REDIS_HOST: redis
        DB_USER: appuser
        DB_PASSWORD: apppassword
      expose:
        - "5000"

    nginx:
      image: nginx:latest
      container_name: nginx_proxy
      depends_on: 
        - api
      ports:
        - "80:80"
      volumes:
        - ./nginx.conf:/etc/nginx/conf.d/default.conf
volumes:
  mysql_data:
